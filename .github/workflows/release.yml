name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift --version
      - run: make test
      - run: make app
        env:
          BOTCH_VERSION: ${{ github.ref_name }}
      - run: gh release create "$TAG" dist/Botch.zip dist/Botch.dmg --title "Botch $TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}

  desktop:
    name: ${{ matrix.name }}
    needs: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
          no-cache: true
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev patchelf build-essential libssl-dev file
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: bun install --frozen-lockfile
      - run: bunx tauri build --config "{\"version\":\"${TAG#v}\"}"
        env:
          TAG: ${{ github.ref_name }}
      - run: |
          bundle=desktop/src-tauri/target/release/bundle
          mkdir -p dist/desktop
          if [ "$RUNNER_OS" = Linux ]; then
            cp "$bundle"/deb/*.deb dist/desktop/Botch-linux-amd64.deb
            cp "$bundle"/appimage/*.AppImage dist/desktop/Botch-linux-x86_64.AppImage
          else
            cp "$bundle"/msi/*.msi dist/desktop/Botch-windows-x64.msi
            cp "$bundle"/nsis/*.exe dist/desktop/Botch-windows-x64-setup.exe
          fi
        working-directory: .
      - run: gh release upload "$TAG" dist/desktop/* --clobber
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
