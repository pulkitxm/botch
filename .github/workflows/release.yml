name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - run: swift --version
      - run: make test
      - run: make app
        env:
          BOTCH_VERSION: ${{ github.ref_name }}
      - run: gh release create "$TAG" dist/Botch.zip dist/Botch.dmg --title "Botch $TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
