config:
  default: true
  MD013:
    line_length: 100
    code_blocks: false
    tables: false
  MD024:
    siblings_only: true
  MD033:
    allowed_elements: [img, br, details, summary, kbd, sub]

globs:
  - "**/*.md"

ignores:
  - .build/**
  - .worktrees/**
  - dist/**
  - node_modules/**
  - target/**
