[package]
name = "botch"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0"
publish = false

[[bin]]
name = "botch"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["unstable", "tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
dirs = "6"
open = "5"

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5", features = ["rt-tokio-crypto-rust"] }
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
soup3 = "0.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
